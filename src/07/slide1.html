<!doctype html>
<html lang="bg"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../tool/base.css">
<style>
h1 { font-size: 76px; }
.tries { display: flex; flex-direction: column; gap: 22px; margin-top: 44px; }
.try { font-family: "Inter", sans-serif; font-size: 34px; color: #9AA1AC; text-decoration: line-through; text-decoration-thickness: 3px; }
.field { background: #fff; border: 2px solid var(--line); border-radius: 28px; padding: 36px 40px; margin-top: 40px; }
.field .cap { font-weight: 600; font-size: 26px; color: var(--muted); margin-bottom: 20px; }
.cursor { display: inline-block; width: 4px; height: 44px; background: var(--orange); vertical-align: middle; }
</style></head><body>

<div class="slide">
  <div class="top"><div class="label">Познато?</div><div class="count">1 / 3</div></div>
  <div>
    <h1>„Пиша нещо, после го трия, защото не ми звучи добре.“</h1>
    <div class="field">
      <div class="cap">Описание на публикацията</div>
      <div class="tries">
        <div class="try">Есента е тук и кожата ти има нужда от…</div>
        <div class="try">Нова процедура!!! Запиши се сега</div>
        <div class="try">Пилинг за лице – най-доброто за…</div>
        <div><span class="cursor"></span></div>
      </div>
    </div>
  </div>
  <div class="bottom">
    <div class="note">Не ти трябва да пишеш поста. Плъзни.</div>
    <div class="brand"><img src="icon.png" alt="">Plamago</div>
  </div>
</div></body></html>
