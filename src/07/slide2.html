<!doctype html>
<html lang="bg"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../tool/base.css">
<style>
h1 { font-size: 68px; }
.rows { display: flex; flex-direction: column; gap: 20px; margin-top: 44px; }
.row { background: #fff; color: var(--ink); border-radius: 28px; padding: 26px 32px; display: flex; align-items: center; gap: 28px; }
.num { font-weight: 800; font-size: 64px; line-height: 1; color: var(--orange); width: 52px; text-align: center; flex-shrink: 0; }
.what { font-weight: 800; font-size: 36px; line-height: 1.15; }
.ex { font-weight: 600; font-size: 28px; color: var(--muted); margin-top: 6px; }
</style></head><body>

<div class="slide orange">
  <div class="top"><div class="label">Вместо това</div><div class="count">2 / 3</div></div>
  <div>
    <h1>Не пиши поста.<br>Напиши 3 неща:</h1>
    <div class="rows">
      <div class="row"><div class="num">1</div><div><div class="what">Процедурата</div><div class="ex">„пилинг за лице“</div></div></div>
      <div class="row"><div class="num">2</div><div><div class="what">Поводът или сезонът</div><div class="ex">„есенна грижа“</div></div></div>
      <div class="row"><div class="num">3</div><div><div class="what">Какво да направи клиентът</div><div class="ex">„запазване на час онлайн“</div></div></div>
    </div>
  </div>
  <div class="bottom">
    <div class="note">Останалото го пише Plamago.</div>
    <div class="brand">Plamago</div>
  </div>
</div></body></html>
