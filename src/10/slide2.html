<!doctype html>
<html lang="bg"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../tool/base.css">
<style>
.slide { justify-content: space-between; }
.step { display: flex; align-items: flex-start; gap: 28px; }
.num { font-weight: 800; font-size: 150px; line-height: 0.85; color: var(--orange); }
h1 { font-size: 52px; }
.snip { background: var(--paper); border: 2px solid var(--line); border-radius: 28px; overflow: hidden; margin: 0 auto; box-shadow: 0 20px 44px rgba(20,20,19,0.10); }
.snip img { display: block; width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.chip { font-size: 28px; padding: 10px 20px; }
</style></head><body>
<div class="slide">
  <div class="top"><div class="label">Как работи</div><div class="count">2 / 3</div></div>
  <div>
    <div class="step"><div class="num">2</div><h1>Пишеш с няколко думи какво искаш да покажеш.</h1></div>
    <div class="row"><div class="chip">масаж с топли камъни</div><div class="chip">подарък за рожден ден</div><div class="chip">ваучер</div></div><div class="snip" style="width: 700px; margin-top: 24px"><img src="form_bottom.png" alt="Полето за ключови думи и бутонът Генерирай текст"></div>
  </div>
  <div class="bottom"><div class="note">Без да мислиш как да го кажеш.</div><div class="brand"><img src="../../tool/icon.png" alt="">Plamago</div></div>
</div>
</body></html>
