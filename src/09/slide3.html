<!doctype html>
<html lang="bg"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../tool/base.css">
<style>
.slide { justify-content: space-between; }
h1 { font-size: 50px; }
.card { background: #fff; border: 2px solid var(--line); border-radius: 28px; padding: 26px 30px; display: flex; flex-direction: column; gap: 16px; margin-top: 22px; }
.cap { font-weight: 600; font-size: 26px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
.chip { font-size: 28px; padding: 10px 20px; }
.tag { padding: 8px 18px; border-radius: 14px; border: 2px solid var(--line); font-weight: 600; font-size: 26px; }
.then { display: flex; align-items: center; gap: 18px; margin-top: 26px; }
.ok { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 999px; background: #fff; border: 2px solid var(--line); font-weight: 700; font-size: 26px; }
</style></head><body>
<div class="slide">
  <div class="top"><div class="label">Как работи</div><div class="count">3 / 3</div></div>
  <div>
    <h1>Ти пишеш няколко думи.</h1>
    <div class="card">
      <div class="cap">Ключови думи / тема</div>
      <div class="row"><div class="chip">пакет 3 процедури за лице</div><div class="chip">предколедна промоция</div><div class="chip">ограничени места</div></div>
      <div class="row"><div class="tag">Facebook</div><div class="tag">Красота</div></div>
    </div>
    <div class="then"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FF6B2C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg><h1>Plamago пише поста.</h1></div>
    <div class="row" style="margin-top: 20px">
      <div class="ok"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Готов текст</div><div class="ok"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Хаштагове</div><div class="ok"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>За секунди</div>
    </div>
  </div>
  <div class="cta">
    <div><div class="q">Искаш ранен достъп?</div><div class="a">Линкът е в био.</div></div>
    <div class="brand">Plamago</div>
  </div>
</div>
</body></html>
